name: OpenBOLA native release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2022
            spec: openbola-windows-x64.spec
            executable: dist/openbola.exe
          - target: macos-arm64
            os: macos-14
            spec: openbola-macos-arm64.spec
            executable: dist/openbola
          - target: macos-x64
            os: macos-13
            spec: openbola-macos-x64.spec
            executable: dist/openbola
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - uses: astral-sh/setup-uv@6b9c6063abd3e3e3f8d4a8c4d6db03a1f51d8a62
        with:
          python-version: '3.11'
      - name: Validate tag and project version
        shell: bash
        run: |
          VERSION=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "workflow ref does not match project version" >&2
            exit 1
          fi
      - name: Install build environment
        run: uv sync --extra all --extra dev
      - name: Build native executable
        run: uv run --with pyinstaller==6.15.0 pyinstaller packaging/pyinstaller/${{ matrix.spec }} --clean --noconfirm --distpath dist --workpath build/pyinstaller
      - name: Smoke test executable
        shell: bash
        run: ${{ matrix.executable }} --version
      - name: Assemble release archive
        shell: bash
        run: |
          VERSION=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          uv run python packaging/build_artifacts.py archive \
            --project-root . --target '${{ matrix.target }}' --version "$VERSION" \
            --tag "$GITHUB_REF_NAME" --executable '${{ matrix.executable }}' --output-dir release
      - name: Attest release archive
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: release/openbola-*.${{ matrix.target == 'windows-x64' && 'zip' || 'tar.gz' }}
      - name: Upload native archive
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: openbola-${{ matrix.target }}
          path: |
            release/openbola-*.zip
            release/openbola-*.tar.gz
            release/openbola.sha256
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@6b9c6063abd3e3e3f8d4a8c4d6db03a1f51d8a62
        with:
          python-version: '3.11'
      - name: Download native archives
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: openbola-*
          path: release-parts
          merge-multiple: true
      - name: Generate and verify SHA256SUMS
        shell: bash
        run: |
          VERSION=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          mkdir -p release
          cp release-parts/openbola-*.zip release-parts/openbola-*.tar.gz release/
          uv run python packaging/build_artifacts.py checksums --output-dir release --output release/SHA256SUMS
          sha256sum --check release/SHA256SUMS
      - name: Upload checksums and archives
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: openbola-release
          path: |
            release/openbola-*.zip
            release/openbola-*.tar.gz
            release/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish approved draft release
    needs: checksums
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@6b9c6063abd3e3e3f8d4a8c4d6db03a1f51d8a62
        with:
          python-version: '3.11'
      - name: Verify approved tag matches project version
        shell: bash
        run: |
          VERSION=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: Download release files
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: openbola-release
          path: release
      - name: Verify release checksums
        run: sha256sum --check release/SHA256SUMS
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@da05d552f1148c13d8b8ecb5f4f5d7f6b4f8f4f5
        with:
          draft: true
          files: |
            release/openbola-*.zip
            release/openbola-*.tar.gz
            release/SHA256SUMS
