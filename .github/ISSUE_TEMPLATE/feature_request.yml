name: Feature request
description: Propose a focused, safety-preserving improvement.
title: "[feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please do not include real target details or credentials. Features that
        widen scope, enable writes, or add provider integrations need an explicit
        threat-model and fail-closed design.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need or testing limitation does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful behavior and its safety boundary.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This proposal does not require publishing secrets or customer data.
          required: true
