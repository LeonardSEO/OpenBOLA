name: Bug report
description: Report a reproducible problem in local or authorized testing.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, customer data, private scope references,
        raw HAR files, or details of an unauthorized target. Use the security
        reporting process for suspected vulnerabilities or secret disclosure.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior without sensitive target data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give a minimal local fixture or test command that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks run
      description: Include relevant pytest, ruff, or mypy results.
