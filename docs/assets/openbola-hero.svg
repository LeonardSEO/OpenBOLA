<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">OpenBOLA — proof, not permission</title>
  <desc id="desc">An offline OpenBOLA launch banner showing an authorization-first API security workflow beside a deterministic terminal panel.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#697386" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#1B2230" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1600" height="520" fill="#F7F4ED"/>
  <rect width="1600" height="520" fill="url(#grid)"/>
  <circle cx="1470" cy="-16" r="240" fill="#1D436E" fill-opacity=".07"/>
  <path d="M0 454C260 404 412 492 665 438S1124 365 1600 424V520H0Z" fill="#1D436E" fill-opacity=".07"/>

  <g transform="translate(102 96)">
    <rect x="0" y="0" width="136" height="30" rx="15" fill="#1D436E"/>
    <circle cx="18" cy="15" r="5" fill="#F7F4ED"/>
    <text x="31" y="20" fill="#F7F4ED" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">LOCAL / SAFE</text>
    <text x="0" y="112" fill="#1B2230" font-family="Georgia,Times New Roman,serif" font-size="82" font-weight="700" letter-spacing="-3">OpenBOLA</text>
    <text x="4" y="160" fill="#1D436E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="27" font-weight="700">Proof, not permission.</text>
    <text x="4" y="199" fill="#697386" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18">Authorization-first BOLA / IDOR validation for APIs.</text>
    <text x="4" y="230" fill="#697386" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16">Scope-checked probes · typed reports · no telemetry</text>
  </g>

  <g transform="translate(972 75)" filter="url(#shadow)">
    <rect width="500" height="370" rx="18" fill="#0A0E13"/>
    <rect width="500" height="48" rx="18" fill="#1B2230"/>
    <rect y="30" width="500" height="18" fill="#1B2230"/>
    <circle cx="25" cy="24" r="6" fill="#F7F4ED" fill-opacity=".75"/>
    <circle cx="46" cy="24" r="6" fill="#697386"/>
    <circle cx="67" cy="24" r="6" fill="#1D436E"/>
    <text x="100" y="29" fill="#F7F4ED" fill-opacity=".78" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">openbola / local fixture</text>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">
      <text x="28" y="96" fill="#F7F4ED"><tspan fill="#697386">$</tspan> openbola scan --scope confirmed.yaml</text>
      <text x="28" y="132" fill="#697386">scope</text><text x="102" y="132" fill="#F7F4ED">confirmed · loopback only</text>
      <text x="28" y="168" fill="#697386">identities</text><text x="126" y="168" fill="#F7F4ED">alice + bob</text>
      <text x="28" y="204" fill="#697386">probe</text><text x="102" y="204" fill="#F7F4ED">read-only · guarded</text>
      <text x="28" y="240" fill="#697386">result</text><text x="102" y="240" fill="#1D436E">BOLA finding · evidence-backed</text>
      <path d="M28 270H472" stroke="#697386" stroke-opacity=".45"/>
      <text x="28" y="308" fill="#F7F4ED"><tspan fill="#697386">$</tspan> reports → json / csv / junit / sarif</text>
      <text x="28" y="340" fill="#697386">zero findings ≠ proof of safety</text>
    </g>
  </g>
</svg>
