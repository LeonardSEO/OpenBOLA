<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">OpenBOLA — authorization-first BOLA testing</title>
  <desc id="desc">An offline social preview with the OpenBOLA wordmark, a local safety badge, and a terminal-style proof summary.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#697386" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1B2230" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#F7F4ED"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <path d="M0 559C244 487 414 604 658 533S1004 471 1280 516V640H0Z" fill="#1D436E" fill-opacity=".08"/>
  <g transform="translate(80 96)">
    <rect width="144" height="32" rx="16" fill="#1D436E"/>
    <circle cx="20" cy="16" r="5" fill="#F7F4ED"/>
    <text x="34" y="21" fill="#F7F4ED" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">LOCAL / SAFE</text>
    <text x="0" y="128" fill="#1B2230" font-family="Georgia,Times New Roman,serif" font-size="88" font-weight="700" letter-spacing="-3">OpenBOLA</text>
    <text x="3" y="180" fill="#1D436E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="700">Proof, not permission.</text>
    <text x="3" y="218" fill="#697386" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18">Deterministic, authorization-first BOLA / IDOR validation.</text>
    <text x="3" y="270" fill="#697386" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16">ScopeGuard · read probes · typed reports · no telemetry</text>
  </g>
  <g transform="translate(740 100)" filter="url(#shadow)">
    <rect width="450" height="420" rx="18" fill="#0A0E13"/>
    <rect width="450" height="48" rx="18" fill="#1B2230"/>
    <rect y="30" width="450" height="18" fill="#1B2230"/>
    <circle cx="24" cy="24" r="6" fill="#F7F4ED" fill-opacity=".75"/>
    <circle cx="45" cy="24" r="6" fill="#697386"/>
    <circle cx="66" cy="24" r="6" fill="#1D436E"/>
    <text x="94" y="29" fill="#F7F4ED" fill-opacity=".78" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">local fixture / audit trail</text>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">
      <text x="28" y="96" fill="#F7F4ED"><tspan fill="#697386">$</tspan> openbola verify</text>
      <text x="28" y="136" fill="#697386">scope</text><text x="104" y="136" fill="#F7F4ED">confirmed · loopback</text>
      <text x="28" y="176" fill="#697386">identities</text><text x="126" y="176" fill="#F7F4ED">alice / bob</text>
      <text x="28" y="216" fill="#697386">access</text><text x="104" y="216" fill="#1D436E">BOLA · evidence-backed</text>
      <path d="M28 250H422" stroke="#697386" stroke-opacity=".45"/>
      <text x="28" y="292" fill="#697386">artifacts</text><text x="126" y="292" fill="#F7F4ED">JSON · CSV · JUnit · SARIF</text>
      <text x="28" y="340" fill="#697386">policy</text><text x="104" y="340" fill="#F7F4ED">AI plans, never requests</text>
      <text x="28" y="388" fill="#697386">honesty</text><text x="104" y="388" fill="#F7F4ED">zero findings ≠ safety</text>
    </g>
  </g>
</svg>
