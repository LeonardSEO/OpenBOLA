[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "openbola"
version = "0.1.0"
description = "Authorization-first automated BOLA/IDOR testing for APIs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "LeonardSEO"}]
keywords = ["api-security", "bola", "idor", "owasp", "pentesting", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "cryptography>=50,<51",
  "httpx>=0.27,<1",
  "keyring>=25.7,<26",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "rich>=13,<16",
  "textual>=0.70,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2,<5"]
capture = ["playwright>=1.48,<2"]
all = [
  "fastmcp>=2,<5",
  "playwright>=1.48,<2",
]
dev = [
  "mypy>=1.13,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "respx>=0.22,<1",
  "ruff>=0.8,<1",
  "types-pyyaml>=6,<7",
]

[project.scripts]
openbola = "openbola.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/openbola"]

[tool.hatch.build.targets.sdist]
exclude = ["bola-tool-plan.md"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["openbola"]
