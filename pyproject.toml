[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "bolacheck"
version = "0.1.0"
description = "Authorization-first automated BOLA/IDOR testing for APIs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Symbis"}]
keywords = ["api-security", "bola", "idor", "owasp", "pentesting", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "rich>=13,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
ai = ["litellm>=1.50,<2"]
mcp = ["fastmcp>=2,<4"]
capture = ["playwright>=1.48,<2"]
all = [
  "litellm>=1.50,<2",
  "fastmcp>=2,<4",
  "playwright>=1.48,<2",
]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "respx>=0.22,<1",
  "ruff>=0.8,<1",
  "types-pyyaml>=6,<7",
]

[project.scripts]
bolacheck = "bola_checker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bola_checker"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["bola_checker"]

